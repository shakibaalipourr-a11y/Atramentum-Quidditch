<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atramentum Quidditch - Stadium</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 50px 20px;
            background: linear-gradient(180deg, #191919, #080808);
        }

        header h1 {
            font-size: 42px;
        }

        header p {
            color: #aaa;
            font-size: 18px;
        }

        .stadium {
            width: 80%;
            max-width: 850px;
            margin: 60px auto;
            padding: 50px 25px;
            background: #121212;
            border: 1px solid #333;
            border-radius: 25px;
        }

        .field {
            font-size: 70px;
            margin: 30px 0;
        }

        .stadium h2 {
            font-size: 32px;
        }

        .stadium p {
            color: #aaa;
            font-size: 18px;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }

        .back:hover {
            background: #ddd;
        }

        footer {
            margin-top: 100px;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>

        <h1>
            🏆 میدان کوییدیچ آترامنتوم
        </h1>

        <p>
            مسابقه آماده شروع است!
        </p>

    </header>


    <main>

        <section class="stadium">

            <div class="field">
                🧹 ⚡ 🏆 ⚡ 🧹
            </div>

            <h2>
                ⚔️ میدان مسابقه
            </h2>

            <p>
                بازیکنان آماده باشید...
            </p>

            <p>
                مسابقات کوییدیچ آترامنتوم به‌زودی آغاز می‌شود.
            </p>

            <a href="index.html" class="back">
                ↩ برگشت به صفحه اصلی
            </a>

        </section>

    </main>


    <footer>
        Atramentum Quidditch © 2026
    </footer>

</body>

</html>
