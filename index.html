<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atramentum Quidditch</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .header {
            padding: 50px 20px;
            background: linear-gradient(180deg, #191919, #080808);
        }

        .logo {
            font-size: 70px;
        }

        h1 {
            font-size: 45px;
            margin: 15px 0;
        }

        .subtitle {
            color: #aaa;
            font-size: 19px;
        }

        .card {
            width: 80%;
            max-width: 700px;
            margin: 60px auto;
            padding: 45px 25px;
            background: #121212;
            border: 1px solid #333;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            font-size: 30px;
        }

        .card p {
            color: #bbb;
            font-size: 18px;
            line-height: 2;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 16px 40px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #dddddd;
        }

        footer {
            margin-top: 100px;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            🧹🏆
        </div>

        <h1>
            آترامنتوم کوییدیچ
        </h1>

        <p class="subtitle">
            به میدان کوییدیچ آترامنتوم خوش آمدید
        </p>

    </header>


    <main>

        <section class="card">

            <h2>
                ⚡ آماده‌ای وارد میدان بشی؟
            </h2>

            <p>
                تیم خودت رو انتخاب کن، وارد مسابقات شو
                و برای قهرمانی بجنگ!
            </p>

            <a href="stadium.html" class="button">
                ورود به میدان 🏆
            </a>

        </section>

    </main>


    <footer>
        Atramentum Quidditch © 2026
    </footer>

</body>

</html>
